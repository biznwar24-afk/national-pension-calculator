<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>국민연금 수령 시기 비교 계산기</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#191919;background:#f7f7f7}*{box-sizing:border-box}body{margin:0;padding:18px 12px}.wrap{max-width:760px;margin:auto;background:#fff;border-radius:12px;padding:22px 18px;box-shadow:0 2px 12px #0000000a}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0 0 16px}.tag{font-size:12px;background:#f2f2f2;padding:5px 9px;border-radius:20px;white-space:nowrap}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label,.muted{color:#737373;font-size:13px}input[type=number],select{width:100%;margin-top:5px;padding:12px;border:1px solid #ddd;border-radius:25px;background:#fff;font:inherit;color:#222}.control{margin-top:22px}.controlhead{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:12px}input[type=range]{width:100%;accent-color:#777;cursor:pointer}.ticks{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}.divider{border:0;border-top:1px solid #eee;margin:28px 0}.results{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result-label{color:#777;font-size:12px}.value{font-size:20px;font-weight:700;margin-top:7px}.summary{margin-top:20px;font-size:15px;line-height:1.65}.small{font-size:12px;color:#777;line-height:1.7;margin-top:12px}.note{font-size:12px;color:#777;margin-top:10px;line-height:1.7}.chart{width:100%;height:auto;margin-top:18px;border:1px solid #eee;border-radius:8px}button{border:1px solid #ddd;border-radius:8px;background:#fff;padding:10px 12px;cursor:pointer;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.error{color:#bd1e1e;font-size:12px;min-height:18px}@media(max-width:480px){.wrap{padding:18px 12px}h1{font-size:17px}.fields{gap:8px}.value{font-size:17px}body{padding:8px}}
</style></head><body><main class="wrap"><header><h1>국민연금 수령 시기 비교 계산기</h1><span class="tag">모의 계산</span></header>
<div class="fields"><div><label for="monthly">정상 월 연금액 (만원)</label><input id="monthly" type="number" value="100" min="0" max="100000" step="1" inputmode="decimal"></div><div><label for="age">정상 수령 나이</label><select id="age"><option value="63">63세</option><option value="64">64세</option><option value="65" selected>65세</option></select></div></div><div id="error" class="error" role="alert"></div>
<section class="control"><div class="controlhead"><label for="delay" style="font-size:15px;color:#191919">연기 기간</label><output id="delayText">5년</output></div><input type="range" id="delay" min="1" max="5" step="1" value="5"><div class="ticks"><span>1년</span><span>3년</span><span>5년</span></div></section>
<section class="control"><div class="controlhead"><label for="end" style="font-size:15px;color:#191919">누적 수령액 비교 나이</label><output id="endText">90세</output></div><input type="range" id="end" min="75" max="100" step="1" value="90"><div class="ticks"><span>75세</span><span>85세</span><span>100세</span></div></section><hr class="divider">
<div class="results"><div><div class="result-label">정상 수령 누적액</div><div class="value" id="normal">30,000만 원</div></div><div><div class="result-label" id="deferredLabel">5년 연기 누적액</div><div class="value" id="deferred">32,640만 원</div></div></div>
<div class="summary" id="summary" aria-live="polite"></div><div class="small" id="details"></div><svg class="chart" id="chart" viewBox="0 0 680 230" role="img" aria-label="연령별 누적 수령액 비교 그래프"></svg>
<div class="note">연금액 고정, 매월 수령, 단순 누적액 기준입니다. 물가상승·세금·건강보험료·투자수익·사망 시점은 반영하지 않습니다. 실제 국민연금 연기 신청 및 지급액은 국민연금공단(1355)에 확인하세요. 정상 수령 나이는 출생 연도에 따라 달라집니다.</div>
<div class="actions"><button id="reset" type="button">초기화</button><button id="copy" type="button">계산 결과 복사</button></div></main>
<script>
'use strict';const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('ko-KR')+'만 원';let latest='';
function update(){let m=Number($('monthly').value),a=Number($('age').value),d=Number($('delay').value),end=Number($('end').value);$('delayText').textContent=d+'년';$('endText').textContent=end+'세';if(!Number.isFinite(m)||m<0||m>100000||$('monthly').value===''){$('error').textContent='월 연금액은 0~100,000만 원 사이의 숫자로 입력해 주세요.';return}$('error').textContent='';const normal=m*12*Math.max(0,end-a),deferred=m*(1+d*.072)*12*Math.max(0,end-a-d),monthlyAfter=m*(1+d*.072),breakAge=a+d+d/(d*.072),diff=Math.abs(normal-deferred);$('normal').textContent=fmt(normal);$('deferredLabel').textContent=d+'년 연기 누적액';$('deferred').textContent=fmt(deferred);let winner=deferred>normal?'연기 수령':normal>deferred?'정상 수령':'두 방식';$('summary').textContent=normal===deferred?`선택한 ${end}세 시점에는 두 방식의 누적 수령액이 같습니다.`:`선택한 ${end}세 시점에는 ${winner}이 누적 ${fmt(diff)} 더 많습니다.`;$('details').textContent=`연기 후 월 수령액: ${fmt(monthlyAfter)} / 누적 손익분기점: 약 ${breakAge.toFixed(1)}세`;latest=`국민연금 수령 시기 비교\n정상 월 연금액: ${fmt(m)}\n정상 수령 나이: ${a}세\n연기 기간: ${d}년\n비교 나이: ${end}세\n정상 수령 누적액: ${fmt(normal)}\n연기 수령 누적액: ${fmt(deferred)}\n${$('summary').textContent}\n손익분기점: 약 ${breakAge.toFixed(1)}세\n※ 물가상승·세금 등 미반영`;draw(m,a,d,end)}
function draw(m,a,d,end){const svg=$('chart'),W=680,H=230,L=64,R=20,T=26,B=38,plotW=W-L-R,plotH=H-T-B,maximum=Math.max(1,m*12*(end-a),m*(1+d*.072)*12*Math.max(0,end-a-d)),y=v=>T+plotH-(v/maximum)*plotH,x=age=>L+(age-a)/(end-a)*plotW;let out='';for(let i=0;i<=4;i++){let v=maximum*i/4,yy=y(v);out+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e9e9e9"/><text x="${L-7}" y="${yy+4}" text-anchor="end" font-size="11" fill="#777">${Math.round(v).toLocaleString()}</text>`}for(let age=a;age<=end;age+=5){out+=`<text x="${x(age)}" y="${H-14}" text-anchor="middle" font-size="11" fill="#777">${age}세</text>`}let n=[],z=[];for(let age=a;age<=end;age+=.25){n.push(`${x(age)},${y(m*12*(age-a))}`);z.push(`${x(age)},${y(m*(1+d*.072)*12*Math.max(0,age-a-d))}`)}out+=`<polyline fill="none" stroke="#3478c0" stroke-width="3" points="${n.join(' ')}"/><polyline fill="none" stroke="#e28c39" stroke-width="3" points="${z.join(' ')}"/><text x="${L}" y="16" font-size="12" fill="#555">누적 수령액 (만원)</text><line x1="${W-215}" y1="14" x2="${W-195}" y2="14" stroke="#3478c0" stroke-width="3"/><text x="${W-190}" y="18" font-size="11">정상</text><line x1="${W-125}" y1="14" x2="${W-105}" y2="14" stroke="#e28c39" stroke-width="3"/><text x="${W-100}" y="18" font-size="11">연기</text>`;svg.innerHTML=out}
['monthly','age','delay','end'].forEach(id=>$(id).addEventListener('input',update));$('reset').addEventListener('click',()=>{$('monthly').value=100;$('age').value=65;$('delay').value=5;$('end').value=90;update()});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(latest);$('copy').textContent='복사 완료';setTimeout(()=>$('copy').textContent='계산 결과 복사',1600)}catch(e){alert('복사 기능을 사용할 수 없습니다. 브라우저에서 계산 결과를 직접 선택해 주세요.')}});update();
</script></body></html>
